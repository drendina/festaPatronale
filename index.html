<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chiamata numeri</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,Arial,sans-serif;background:#10151f;color:#fff}
/* ---------- TV ---------- */
#tv{display:none;grid-template-columns:1.6fr 1fr;height:100vh;overflow:hidden}
.now{background:#ffd23f;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center}
.now small{font-size:7vh;font-weight:700}
.now b{font-size:52vh;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.now.flash{animation:fl .8s 3}
@keyframes fl{50%{background:#fff}}
.hist{padding:4vh 4vw;display:flex;flex-direction:column}
.hist h2{font-size:6vh;margin-bottom:2vh;color:#9fb0c8}
.hist ol{list-style:none;padding:0}
.hist li{font-size:6.2vh;height:8vh;font-weight:800;font-variant-numeric:tabular-nums;border-bottom:.3vh solid #26314a;display:flex;align-items:center}
.hist li:first-child{color:#ffd23f}
#dot{position:fixed;right:1.5vh;bottom:1.5vh;width:2vh;height:2vh;border-radius:50%;background:#e5484d}
#dot.ok{background:#30a46c}
@media (orientation:portrait){
#tv{grid-template-columns:1fr;grid-template-rows:38vh 1fr}
.now small{font-size:3.6vh}
.now b{font-size:min(24vh,36vw)}
.hist{padding:2vh 6vw}
.hist h2{font-size:3.6vh;margin-bottom:1vh}
.hist li{font-size:4.6vh;height:5.6vh}
#dot{width:1.4vh;height:1.4vh}
}
/* ---------- TELEFONO ---------- */
#remote{display:none;min-height:100vh;min-height:100dvh;padding:16px;flex-direction:column;gap:14px;max-width:520px;margin:auto}
.cur{text-align:center;background:#1b2436;border-radius:16px;padding:14px}
.cur small{color:#9fb0c8;font-size:16px}
.cur b{display:block;font-size:88px;line-height:1.1;color:#ffd23f}
button{font:inherit;font-weight:800;border:0;border-radius:16px;color:#111;background:#e6ebf5;padding:18px;font-size:20px}
button:active{transform:scale(.97)}
.disp{background:#0b0f17;border:2px solid #34405c;border-radius:16px;text-align:center;font-size:56px;font-weight:900;padding:8px;min-height:84px;color:#fff;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{font-size:34px;padding:16px 0}
.pad .f{background:#34405c;color:#fff;font-size:26px}
.row{display:flex;gap:10px}
#again{flex:1 1 auto}
#undo{background:#e5484d;color:#fff;flex:0 0 auto;margin-left:auto;padding-left:22px;padding-right:22px}
#call{background:#ffd23f;font-size:40px;padding:30px 18px;position:sticky;bottom:12px}
.info{margin-top:auto}
#reset{background:none;color:#7d8aa3;font-size:14px;padding:8px}
.info{color:#9fb0c8;font-size:14px;line-height:1.5;word-break:break-all}
.info a{color:#ffd23f}
</style>
</head>
<body>

<div id="tv">
  <div class="now" id="now"><small>Numero chiamato</small><b id="big">–</b></div>
  <div class="hist"><h2>Ultimi chiamati</h2><ol id="list"></ol></div>
  <div id="dot" title="Connessione"></div>
</div>

<div id="remote">
  <div class="cur"><small>Ultimo chiamato</small><b id="rcur">–</b></div>
  <div class="disp" id="disp">—</div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="f" data-k="clr">C</button><button data-k="0">0</button><button class="f" data-k="del">⌫</button>
  </div>
  <div class="row"><button id="again">Richiama</button><button id="undo">Annulla ultimo</button></div>
  <button id="reset">Azzera tutto</button>
  <p class="info">TV: <a id="tvlink" target="_blank"></a><br>Cellulari: <a id="mblink" target="_blank"></a></p>
  <button id="call">Chiama</button>
</div>

<script>
// Cambia questa parola con una tua (solo lettere/numeri): serve a collegare telefono e TV
const CANALE = "ordini-k7x2m9qz";
const URL_CANALE = "https://ntfy.sh/" + CANALE;

const $ = id => document.getElementById(id);
const isTV = location.hash === "#tv" || location.hash === "#mobile";
const isMobile = location.hash === "#mobile";
window.onhashchange = () => location.reload();
let state = {n: 0, h: [], t: 0};

/* ---------- Comune ---------- */
function ricevi(s) { if (s && typeof s.n === "number" && s.t >= state.t) { const nuovo = s.t !== state.t; state = s; render(nuovo); } }

/* ---------- TV ---------- */
function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.value = f; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(.4, c.currentTime + i * .25); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + i * .25 + .22);
      o.start(c.currentTime + i * .25); o.stop(c.currentTime + i * .25 + .25);
    });
  } catch (e) {}
}
function render(nuovo) {
  if (isTV) {
    $("big").textContent = state.h.length ? state.n : "–";
    $("list").innerHTML = state.h.map(x => "<li>" + x + "</li>").join("");
    if (nuovo && state.h.length) {
      const el = $("now"); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); if (isMobile) { navigator.vibrate && navigator.vibrate([200, 100, 200]); } else beep();
    }
  } else {
    $("rcur").textContent = state.h.length ? state.n : "–";
  }
}
function avviaTV() {
  $("tv").style.display = "grid";
  const cerca = () => {
    const es = new EventSource(URL_CANALE + "/sse?since=latest");
    es.onopen = () => $("dot").classList.add("ok");
    es.onerror = () => $("dot").classList.remove("ok");
    es.onmessage = e => { try { ricevi(JSON.parse(JSON.parse(e.data).message)); } catch (x) {} };
  };
  cerca();
}

/* ---------- Telefono ---------- */
function invia(s) {
  s.t = Date.now(); state = s; render(false);
  localStorage.setItem("stato", JSON.stringify(s));
  fetch(URL_CANALE, {method: "POST", body: JSON.stringify(s)}).catch(() => alert("Invio non riuscito: controlla la connessione"));
}
function chiama(x) {
  x = parseInt(x, 10); if (isNaN(x) || x < 0) return;
  invia({n: x, h: [x, ...state.h].slice(0, 10), t: 0});
}
function avviaTelefono() {
  $("remote").style.display = "flex";
  const link = location.href.split("#")[0] + "#tv";
  $("tvlink").textContent = link; $("tvlink").href = link;
  const ml = location.href.split("#")[0] + "#mobile";
  $("mblink").textContent = ml; $("mblink").href = ml;
  try { state = JSON.parse(localStorage.getItem("stato")) || state; } catch (e) {}
  render(false);
  let dig = "";
  const agg = () => $("disp").textContent = dig || "—";
  $("pad").onclick = e => {
    const k = e.target.dataset.k; if (k === undefined) return;
    if (k === "del") dig = dig.slice(0, -1); else if (k === "clr") dig = ""; else if (dig.length < 4) dig += k;
    agg();
  };
  $("call").onclick = () => { if (dig) { chiama(dig); dig = ""; agg(); } };
  $("again").onclick = () => state.h.length && invia({...state});
  $("undo").onclick = () => {
    if (!state.h.length) return;
    if (confirm("Annullare l'ultimo numero chiamato (" + state.n + ")?")) { const h = state.h.slice(1); invia({n: h[0] || 0, h, t: 0}); }
  };
  $("reset").onclick = () => confirm("Azzerare tutti i numeri?") && invia({n: 0, h: [], t: 0});
}

isTV ? avviaTV() : avviaTelefono();
</script>
</body>
</html>
